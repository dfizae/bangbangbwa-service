spring:
  application:
    name: bangbangbwa

  datasource:
    url: jdbc:postgresql://localhost:5432/bangbangbwa
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 120MB

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 333600000

server:
  port: 8080

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
app:
  ai-server:
    base-url: ${AI_SERVER_BASE_URL}
    token: ${AI_SERVER_TOKEN}
  rtc:
    join-base-url: ${RTC_JOIN_BASE_URL}
    signaling-url: ${RTC_SIGNALING_URL}
    signaling-token-expiration: 300000

gms:
  api-key: ${GMS_KEY}
  base-url: https://gms.ssafy.io/gmsapi/api.anthropic.com
  model: claude-sonnet-4-6
  max-tokens: 1024
